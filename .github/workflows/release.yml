name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-amd64, ext: "" }
          - { os: macos-latest, name: macos-arm64, ext: "" }
          - { os: windows-latest, name: windows-amd64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: whatsapp-bridge/go.mod
          cache-dependency-path: whatsapp-bridge/go.sum
      - name: Build
        shell: bash
        working-directory: whatsapp-bridge
        env:
          CGO_ENABLED: "1"
        run: |
          go build -trimpath -ldflags "-s -w -X main.Version=${GITHUB_REF_NAME}" -o "../whatsapp-bridge-${{ matrix.name }}${{ matrix.ext }}" .
      - uses: actions/upload-artifact@v7
        with:
          name: whatsapp-bridge-${{ matrix.name }}
          path: whatsapp-bridge-${{ matrix.name }}${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
