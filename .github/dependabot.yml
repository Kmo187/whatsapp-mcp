version: 2
updates:
  - package-ecosystem: gomod
    directory: /whatsapp-bridge
    schedule: { interval: weekly }
    groups:
      go-deps: { patterns: ["*"] }
  - package-ecosystem: uv
    directory: /whatsapp-mcp-server
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
