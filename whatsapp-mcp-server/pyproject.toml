[project]
name = "whatsapp-mcp-server"
version = "1.0.0"
description = "MCP server that lets Claude and other AI assistants search, summarise and send messages on your personal WhatsApp – locally, with safety guards."
license = "MIT"
requires-python = ">=3.11"
keywords = ["whatsapp", "mcp", "model-context-protocol", "claude", "ai-agent", "llm", "whatsmeow"]
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=2.3.0,<3",
]

[project.urls]
Homepage = "https://github.com/Kmo187/whatsapp-mcp"
Issues = "https://github.com/Kmo187/whatsapp-mcp/issues"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
files = ["main.py", "whatsapp.py", "bridge.py", "config.py", "guards.py"]
